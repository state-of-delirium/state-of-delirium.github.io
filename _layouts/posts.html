---
layout: default
---

<h1><span class="dotted-underline-2">{{ page.title }}</span></h1>

<section class="blog-post-info">
    <p><i>{{ page.date | date: "%-d %b %y" }}{% if page.edited %} / {{ page.edited | date: "%-d %b %y" }}{% endif %}</i></p>
    <p>{{ page.author }}</p>
    {% if page.confidence %}
        {% include confidence.html %}
    {% endif %}
    <p class="reading-time"></p>
</section>

<section class="blog-post-content">
    {% include toc.html %}
    {{ content }}
</section>

<script>
    {% include reading_time.js %}
</script>

<script>
    {% include footnote.js %}
</script>
