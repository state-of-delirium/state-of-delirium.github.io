<nav>
    <a href="/" class="logo"><img src="{{site.baseurl}}/assets/images/state-of-delirium.svg" alt="STATE OF DELIRIUM"></a>
    <details id="no-js-msg">
        <summary>No JS?</summary>
        <p>While this site is functional without JS, minimal scripting is used for small features and aesthetic flourishes. Consider whitelisting!</p>
    </details>
    {% for item in site.data.navigation %}
    <a href="{{ item.link }}" {% if page.url == item.link %}class="currentNav"{% endif %}>
        {{ item.name }}
    </a>
    {% endfor %}
    <a href="/feed.xml" class="rss">
        <img src="{{site.baseurl}}/assets/images/rss.svg" alt="RSS" class="rss-static">
        <img src="{{site.baseurl}}/assets/images/rss-dark.svg" alt="RSS" class="rss-static-dark">
        <img src="{{site.baseurl}}/assets/images/rss-hover.svg" alt="RSS" class="rss-hover">
    </a>
    <button type="button" id="theme-toggle" style="display: none;" class="theme-toggle">
        <img src="{{site.baseurl}}/assets/images/light.svg" alt="Light Mode" class="light">
        <img src="{{site.baseurl}}/assets/images/dark.svg" alt="Dark Mode" class="dark">
        <img src="{{site.baseurl}}/assets/images/light-hover.svg" alt="Light Mode" class="light-hover">
        <img src="{{site.baseurl}}/assets/images/dark-hover.svg" alt="Dark Mode" class="dark-hover">
    </button>
</nav>

<script>
    msgElement = document.getElementById("no-js-msg");
    msgElement.remove();
</script>

<script>
    {% include theme-toggle.js %}
</script>
