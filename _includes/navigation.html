<nav>
    <a href="/" class="logo"><img src="{{site.baseurl}}/assets/images/state-of-delirium.svg" alt="STATE OF DELIRIUM"></a>
    <details id="no-js-msg">
        <summary>No JS?</summary>
        <p>While this site is functional without JS, minimal scripting is used for small features and aesthetic flourishes. Consider whitelisting!</p>
    </details>
    {% for item in site.data.navigation %}
    <a href="{{ item.link }}" {% if page.url == item.link %}class="currentNav"{% endif %}>
        {{ item.name }}
    </a>
    {% endfor %}
    <a href="/rss" class="rss" {% if page.url == "/rss" %}id="rssCurrent"{% endif %}>
        {% include rss-logos.html %}
    </a>
    <button type="button" id="theme-toggle" style="display: none;" class="theme-toggle">
        {% include theme-logos.html %}
    </button>
</nav>

<script>
    msgElement = document.getElementById("no-js-msg");
    msgElement.remove();
</script>

<script>
    {% include theme-toggle.js %}
</script>
